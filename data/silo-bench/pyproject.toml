[project]
name = "silo-bench"
version = "1.0.0"
description = "SILO-BENCH: A role-free benchmark for evaluating multi-agent LLM collaboration under information silos"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "openai>=2.8.1",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "srsly>=2.5.2",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.10.0",
    "pandas>=2.0.0",
]
