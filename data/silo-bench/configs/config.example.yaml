# SILO-BENCH Configuration
# Copy this file to config.yaml and fill in your API credentials.
# config.yaml is gitignored and will not be committed.

# Default model configuration
default:
  api_base: "https://api.openai.com/v1"
  api_key: "your-api-key-here"
  model: "gpt-4o"

# You can define multiple model profiles below.
# Use --profile <name> in batch_run.py to select one.

profiles:
  openai:
    api_base: "https://api.openai.com/v1"
    api_key: "your-openai-api-key"
    model: "gpt-4o"

  deepseek:
    api_base: "https://api.deepseek.com/v1"
    api_key: "your-deepseek-api-key"
    model: "deepseek-chat"

  grok:
    api_base: "https://api.x.ai/v1"
    api_key: "your-xai-api-key"
    model: "grok-3"

  openrouter:
    api_base: "https://openrouter.ai/api/v1"
    api_key: "your-openrouter-api-key"
    model: "openai/gpt-4o"
